# BLYB 同源入口（DEP-A12/A07）：唯一登记入口；后端 8000/8001/8002 不发布宿主机端口。
# 路由约定（与前端构建期默认配套：VITE_CORE_DEFAULT=''、VITE_STORAGE_DEFAULT='/storage'）：
#   /                 → core:8000（/api/v1/**、/docs、/openapi.json、/ui 前端静态）
#   /storage/         → storage:8001（前缀剥离）
#   /exchange/        → exchange:8002（前缀剥离；PULL 发布的批准路径）
# TLS 证书由宿主机 BLYB_TLS_CERT_DIR 只读挂载（tls.crt/tls.key）；
# 隔离验证可用一次性测试证书，正式环境必须换成院方证书（不关闭校验）。

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/blyb/certs/tls.crt;
    ssl_certificate_key /etc/blyb/certs/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # 分片上传/下载由后端按会话校验，网关不截断正文
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 核心API与控制台（含 /ui 静态）
    location / {
        proxy_pass http://core:8000;
    }

    # 存储服务：剥前缀（后端自身路由为 /api/v1/storage/** 等）
    location /storage/ {
        proxy_pass http://storage:8001/;
    }

    # 交换 PULL 能力的批准路径（exchange 不对宿主机发布端口 ≠ 服务关闭）
    location /exchange/ {
        proxy_pass http://exchange:8002/;
    }
}
